name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gnome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Test
        working-directory: gnome/mawaqit@akramb.com
        run: |
          node tests/presentation.mjs
          gjs -m tests/calendar.js
          gjs -m tests/notifications.js
      - name: Package extension
        working-directory: gnome/mawaqit@akramb.com
        run: zip -r "$GITHUB_WORKSPACE/mawaqit@akramb.com.shell-extension.zip" . -x 'tests/*'
      - uses: actions/upload-artifact@v5
        with:
          name: gnome
          path: mawaqit@akramb.com.shell-extension.zip

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: macos
        run: swift test
      - name: Import Developer ID certificate
        if: github.event_name != 'pull_request'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::Signing secrets are not set. See macos/README.md → Release from GitHub Actions."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security find-identity -v -p codesigning "$keychain"
      - name: Build, sign and notarize
        if: github.event_name != 'pull_request'
        working-directory: macos
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APP_BUILD: ${{ github.run_number }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) export APP_VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          ./release.sh
      - name: Unsigned build
        if: github.event_name == 'pull_request'
        working-directory: macos
        run: ./build-app.sh
      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: |
            macos/dist/Mawaqit.dmg
            macos/dist/Mawaqit.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gnome, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            Mawaqit.dmg Mawaqit.zip mawaqit@akramb.com.shell-extension.zip
